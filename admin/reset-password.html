<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071521">
    <title>Cat Tracker — Reset Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="reset-password.css">
</head>

<body>

<main class="reset-screen">

    <section class="reset-box">

        <div class="reset-logo">
            <img src="../assets/cats/logo-face-1.png" alt="Cat Tracker">
        </div>

        <div class="reset-kicker">
            ONE MILLION CAT PROJECT
        </div>

        <h1>NEW PASSWORD</h1>

        <p class="reset-description">
            CREATE A NEW PASSWORD FOR YOUR ADMIN ACCOUNT.
        </p>

        <form id="resetForm">

            <label for="password">
                NEW PASSWORD
            </label>

            <input
                id="password"
                type="password"
                autocomplete="new-password"
                placeholder="NEW PASSWORD"
                minlength="6"
                required
            >

            <label for="confirmPassword">
                CONFIRM PASSWORD
            </label>

            <input
                id="confirmPassword"
                type="password"
                autocomplete="new-password"
                placeholder="CONFIRM PASSWORD"
                minlength="6"
                required
            >

            <button
                id="resetButton"
                type="submit"
            >
                UPDATE PASSWORD
            </button>

        </form>

        <div
            id="resetMessage"
            class="reset-message"
        ></div>

        <a
            id="backToAdmin"
            class="back-link"
            href="./"
        >
            BACK TO ADMIN
        </a>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="reset-password.js"></script>

</body>
</html>
