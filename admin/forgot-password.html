<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#071521"
    >

    <title>Cat Tracker — Forgot Password</title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="forgot-password.css"
    >

</head>


<body>


    <main class="forgot-screen">


        <section class="forgot-box">


            <div class="forgot-logo">

                <img
                    src="../assets/cats/logo-face-1.png"
                    alt="Cat Tracker"
                >

            </div>


            <div class="forgot-kicker">

                ONE MILLION CAT PROJECT

            </div>


            <h1>

                RESET PASSWORD

            </h1>


            <p class="forgot-description">

                ENTER YOUR ADMIN EMAIL TO RECEIVE A PASSWORD RESET LINK.

            </p>


            <form id="forgotForm">


                <label for="email">

                    ADMIN EMAIL

                </label>


                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    placeholder="YOUR EMAIL"
                    required
                >


                <button
                    id="sendButton"
                    type="submit"
                >

                    SEND RESET LINK

                </button>


            </form>


            <div
                id="forgotMessage"
                class="forgot-message"
            ></div>


            <a
                href="./"
                class="back-link"
            >

                BACK TO ADMIN

            </a>


        </section>


    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="forgot-password.js"></script>


</body>

</html>
